[package]
name = "pod-resources-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
tokio = "1.48"
tokio-util = "0.7.17"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
# gRPC dependencies for kubelet pod-resources API
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
oci-spec = { version = "0.8.1", features = ["runtime"] }
container-device-interface = "0.1.2"
slog = "2.5.2"
slog-scope = "4.4.0"

[build-dependencies]
tonic-prost-build = "0.14"
